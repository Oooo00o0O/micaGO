# micaGO release pipeline.
#
# Triggers:
#   * Push a tag like v0.63.0  -> builds everything and PUBLISHES a GitHub Release.
#   * Manual "Run workflow"    -> builds everything as downloadable artifacts only
#                                 (no release is published) — use it to test the pipeline.
#
# Artifacts:
#   Android APK, unsigned iOS IPA, native WinUI Windows zip, Flutter Linux
#   tar.gz, and macOS DMG.
#
# macOS signing/notarization is OPTIONAL: with no secrets configured the DMG is
# built unsigned (same as before). To sign + notarize, add these repo secrets:
#   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12 certificate
#   MACOS_CERT_PASSWORD   password of that .p12
#   MACOS_SIGN_IDENTITY   e.g. Developer ID Application: Your Name (TEAMID)
#   APPLE_ID              Apple ID email used for notarization
#   APPLE_TEAM_ID         10-char team id
#   APPLE_APP_PASSWORD    app-specific password (appleid.apple.com -> Sign-In & Security)
#   SPARKLE_PRIVATE_KEY    Sparkle EdDSA private key exported by generate_keys -x
# Android release signing is required. Add these repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64-encoded PKCS12/JKS release keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       private-key password
#
# The version comes from MicaGoFlutterClient/pubspec.yaml; every component and
# release tag must match it (prevents shipping mixed or stale versions).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Check component and tag versions
        run: |
          PUBSPEC_VERSION="$(grep '^version:' MicaGoFlutterClient/pubspec.yaml | awk '{print $2}')"
          VERSION="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER="${PUBSPEC_VERSION##*+}"
          GO_VERSION="$(sed -n 's/^var Version = "v\([^"]*\)"/\1/p' MicaGoServer/micago-server/internal/version/version.go)"
          WINDOWS_VERSION="$(sed -n 's:.*<MicaGoVersion>\([^<]*\)</MicaGoVersion>.*:\1:p' MicaGoWindowsClient/Directory.Build.props)"
          MACOS_VERSIONS="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' MicaGoServer/micago-mac-companion/MicaGoCompanion.xcodeproj/project.pbxproj | sort -u)"
          for component in GO_VERSION WINDOWS_VERSION MACOS_VERSIONS; do
            if [ "${!component}" != "$VERSION" ]; then
              echo "::error::$component (${!component:-missing}) does not match pubspec version $VERSION"
              exit 1
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION. Bump the version files first, then re-tag."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION (build $BUILD_NUMBER)"

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Configure release signing
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::$value is required for Android release signing"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/micago-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s\n' \
            "storeFile=$KEYSTORE_PATH" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > MicaGoFlutterClient/android/key.properties
      - name: Analyze
        working-directory: MicaGoFlutterClient
        run: flutter analyze
      - name: Test
        working-directory: MicaGoFlutterClient
        run: flutter test
      - name: Build APK
        working-directory: MicaGoFlutterClient
        run: flutter build apk --release
      - name: Rename artifact
        run: |
          mkdir -p out
          cp MicaGoFlutterClient/build/app/outputs/flutter-apk/app-release.apk \
            "out/micaGO-${{ needs.meta.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    needs: meta
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Build iOS (no codesign)
        working-directory: MicaGoFlutterClient
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p out Payload
          cp -R MicaGoFlutterClient/build/ios/iphoneos/Runner.app Payload/
          zip -qry "out/micaGO-${{ needs.meta.outputs.version }}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: out/*.ipa
          if-no-files-found: error

  windows:
    name: Windows x64 (native WinUI)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Run Windows contract tests
        working-directory: MicaGoWindowsClient
        run: dotnet run --project tests/micaGO.Core.ContractTests -c Release
      - name: Build and package native Windows client
        working-directory: MicaGoWindowsClient
        run: ./scripts/package-release-x64.ps1
      - name: Version artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item `
            "MicaGoWindowsClient/artifacts/micaGO-release-x64.zip" `
            "out/micaGO-${{ needs.meta.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: out/*.zip
          if-no-files-found: error

  linux:
    name: Linux tar.gz
    needs: meta
    # Flutter CI-tests Linux desktop deployment on Ubuntu 22.04. Building on
    # that baseline also avoids unnecessarily requiring Ubuntu 24.04's glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Build Linux
        working-directory: MicaGoFlutterClient
        run: flutter build linux --release
      - name: Package tar.gz
        run: |
          mkdir -p out staging
          cp -r MicaGoFlutterClient/build/linux/x64/release/bundle staging/micaGO
          tar -C staging -czf "out/micaGO-${{ needs.meta.outputs.version }}-linux-x64.tar.gz" micaGO
      - uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: out/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS DMG (Companion + bundled backend)
    needs: meta
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # A complete secret set produces a signed, notarized release with an
      # appcast. With none configured, both tag and manual builds are unsigned.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: MicaGoServer/micago-server/go.mod
          cache-dependency-path: MicaGoServer/micago-server/go.sum
      - name: Go tests
        working-directory: MicaGoServer/micago-server
        run: |
          go vet ./...
          go test ./...
      - name: Install create-dmg
        run: |
          brew untap aws/tap || true
          brew install create-dmg
      - name: Validate optional macOS release credentials
        run: |
          SECRET_NAMES=(MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SPARKLE_PRIVATE_KEY)
          CONFIGURED=0
          for name in "${SECRET_NAMES[@]}"; do
            if [ -n "${!name}" ]; then
              CONFIGURED=$((CONFIGURED + 1))
            fi
          done
          if [ "$CONFIGURED" -ne 0 ] && [ "$CONFIGURED" -ne "${#SECRET_NAMES[@]}" ]; then
            echo "::error::macOS release credentials must be either all configured or all omitted"
            exit 1
          fi
      - name: Import signing certificate (only when secrets are set)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build DMG
        working-directory: MicaGoServer/micago-mac-companion
        run: |
          chmod +x scripts/package-dmg.sh
          export VERSION="${{ needs.meta.outputs.version }}"
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            export SIGN_IDENTITY="$MACOS_SIGN_IDENTITY"
            echo "Signing enabled"
          else
            echo "No signing secrets; building unsigned DMG"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            export NOTARIZE=1
            echo "Notarization enabled"
          fi
          if [ -n "$SPARKLE_PRIVATE_KEY" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            export GENERATE_APPCAST=1
            echo "Sparkle appcast signing enabled"
          fi
          scripts/package-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            MicaGoServer/micago-mac-companion/build/release/micaGO-Companion-${{ needs.meta.outputs.version }}-mac.dmg
            MicaGoServer/micago-mac-companion/build/release/appcast.xml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [meta, android, ios, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## micaGO ${{ needs.meta.outputs.version }}

            ### Downloads
            | Platform | File |
            | --- | --- |
            | macOS (Companion + server) | `micaGO-Companion-${{ needs.meta.outputs.version }}-mac.dmg` |
            | Android | `micaGO-${{ needs.meta.outputs.version }}-android.apk` |
            | iOS (unsigned, sideload) | `micaGO-${{ needs.meta.outputs.version }}-ios-unsigned.ipa` |
            | Windows | `micaGO-${{ needs.meta.outputs.version }}-windows-x64.zip` |
            | Linux | `micaGO-${{ needs.meta.outputs.version }}-linux-x64.tar.gz` |
            | Checksums | `SHA256SUMS` |

            ### Notes
            - The Mac DMG bundles the Go backend; no separate install is needed. It is signed and notarized when the complete optional macOS credential set is configured, otherwise it is unsigned.
            - The iOS IPA is **unsigned** — sign/sideload it yourself (e.g. AltStore/Sideloadly).
            - The Windows archive contains the native WinUI client. The Linux archive contains the complete Flutter bundle; extract it and run `mica_go`.
            - On Debian/Ubuntu, the Linux runtime libraries can be installed with `sudo apt-get install libgtk-3-0 libblkid1 liblzma5 libsecret-1-0`.
            - Windows/Linux desktop builds are experimental.
